{% extends "base.html" %}
{% block title %}Sign In — SmartAttend{% endblock %}
{% block content %}
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap');

:root {
  --primary: #0F204C;
  --primary-dark: #08112C;
  --accent: #E1251B;
  --bg-light: #F4F6F9;
  --text-main: #111827;
  --text-muted: #6B7280;
  --input-bg: #FFFFFF;
  --card-bg: #FFFFFF;
  --border-color: #E5E7EB;
  --font-heading: 'Manrope', sans-serif;
  --font-body: 'Inter', sans-serif;
}

[data-theme='dark'] {
  --bg-light: #0B1120;
  --card-bg: #111827;
  --text-main: #F9FAFB;
  --text-muted: #9CA3AF;
  --input-bg: #1F2937;
  --border-color: #374151;
}

body {
  margin: 0;
  padding: 0;
  font-family: var(--font-body);
  background: var(--bg-light);
  color: var(--text-main);
}

.login-container {
  min-height: 85vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-card {
  width: 100%;
  max-width: 440px;
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 24px;
  padding: 40px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.login-brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 28px;
}

.brand-icon {
  width: 44px;
  height: 44px;
  background: var(--primary);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 16px rgba(15, 32, 76, 0.25);
}

.brand-icon svg {
  width: 24px;
  height: 24px;
  stroke: #FFFFFF;
}

.brand-title {
  font-family: var(--font-heading);
  font-size: 24px;
  font-weight: 800;
  color: var(--primary);
  letter-spacing: -0.5px;
}

[data-theme='dark'] .brand-title {
  color: #FFFFFF;
}

.login-header {
  text-align: center;
  margin-bottom: 32px;
}

.login-header h1 {
  font-family: var(--font-heading);
  font-size: 26px;
  font-weight: 800;
  margin-bottom: 8px;
  color: var(--text-main);
}

.login-header p {
  font-size: 14px;
  color: var(--text-muted);
}

.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

.input-wrapper i.input-icon {
  position: absolute;
  left: 16px;
  color: var(--text-muted);
  font-size: 15px;
}

.form-input {
  width: 100%;
  padding: 14px 16px 14px 44px;
  background: var(--input-bg);
  border: 1.5px solid var(--border-color);
  border-radius: 12px;
  font-size: 14px;
  font-family: var(--font-body);
  color: var(--text-main);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.form-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(15, 32, 76, 0.1);
}

.password-toggle {
  position: absolute;
  right: 16px;
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 15px;
  padding: 0;
}

.form-options {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
  font-size: 13px;
}

.remember-me {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  color: var(--text-muted);
  user-select: none;
}

.remember-me input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--primary);
  cursor: pointer;
}

.forgot-link {
  color: var(--primary);
  text-decoration: none;
  font-weight: 600;
  transition: color 0.2s;
}

[data-theme='dark'] .forgot-link {
  color: #60A5FA;
}

.forgot-link:hover {
  text-decoration: underline;
}

.btn-login {
  width: 100%;
  padding: 14px;
  background: var(--primary);
  color: #FFFFFF;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  font-family: var(--font-heading);
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
  box-shadow: 0 8px 20px rgba(15, 32, 76, 0.2);
}

.btn-login:hover {
  background: #1C3B78;
  transform: translateY(-1px);
  box-shadow: 0 12px 24px rgba(15, 32, 76, 0.3);
}

.btn-login:active {
  transform: translateY(0);
}

.login-footer {
  margin-top: 32px;
  text-align: center;
  padding-top: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.login-footer i {
  color: #10B981;
}

.register-prompt {
  margin-top: 16px;
  text-align: center;
  font-size: 13px;
  color: var(--text-muted);
}

.register-prompt a {
  color: var(--primary);
  font-weight: 600;
  text-decoration: none;
}

[data-theme='dark'] .register-prompt a {
  color: #60A5FA;
}

.register-prompt a:hover {
  text-decoration: underline;
}
</style>

<div class="login-container">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="brand-title">SMARTATTEND</div>
    </div>

    <div class="login-header">
      <h1>Welcome back 👋</h1>
      <p>Sign in to continue to your account</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" id="loginForm">
      <div class="form-group">
        <label class="form-label" for="identifier">ID / Username</label>
        <div class="input-wrapper">
          <i class="fas fa-user input-icon"></i>
          <input 
            type="text" 
            id="identifier" 
            name="identifier" 
            class="form-input" 
            placeholder="Enter your ID or username" 
            required 
            autofocus 
            autocomplete="username"
          >
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock input-icon"></i>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-input" 
            placeholder="••••••••••••" 
            required 
            autocomplete="current-password"
          >
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
            <i class="fas fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" name="remember" value="on">
          <span>Remember me</span>
        </label>
        <a href="{{ url_for('auth.forgot_password') }}" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-login">
        SIGN IN
      </button>
    </form>

    <div class="register-prompt">
      New Faculty? <a href="{{ url_for('auth.register') }}">Register for account</a>
    </div>

    <div class="login-footer">
      <i class="fas fa-shield-halved"></i>
      <span>Secure Role-Based Access</span>
    </div>
  </div>
</div>

<script>
function togglePasswordVisibility() {
  const pwdInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');
  if (pwdInput.type === 'password') {
    pwdInput.type = 'text';
    eyeIcon.className = 'fas fa-eye-slash';
  } else {
    pwdInput.type = 'password';
    eyeIcon.className = 'fas fa-eye';
  }
}
</script>
{% endblock %}
